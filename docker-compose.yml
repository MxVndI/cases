
services: 
  traefik:
    image: traefik:v3.0
    container_name: traefik-ch
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro    
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - backend
    depends_on:
      - authservice
      - userservice
      - casesservice
      - adminservice
      - paymentservice
    restart: unless-stopped

  redis:
    image: redis:8.4.0
    container_name: redis-ch
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - casehub_redis_data:/data
    networks:
      - backend

  mongodb:
    image: mongo:8.0
    container_name: mongodb-ch
    ports:
      - "27017:27017"
    volumes:
      - casehub_db_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express
    container_name: mongo-express-ch
    restart: always
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
    
      REDIS_HOSTS: local:redis:6379 
    ports:
      - 8082:8081 
    depends_on:
      - redis
    networks:
      - backend

 
  rustfs-server:
    image: rustfs/rustfs:latest
    container_name: rustfs_casehub
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - casehub_rustfs_data:/data
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_LOG_LEVEL: info
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-ch
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost/api
    networks:
      - backend
    restart: unless-stopped

  authservice:
    build:
      context: ./backend
      dockerfile: auth/Dockerfile_api
    container_name: auth.api-ch
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:   
      MONGODB_DB_NAME: auth_db      
      APP_NAME: auth.api
      LOG_LEVEL: INFO
    depends_on:   
      - redis    
      - mongodb 
    networks:
      - backend
    restart: unless-stopped

  userservice:
    build:
      context: ./backend
      dockerfile: user/Dockerfile_api
    container_name: community.api-ch
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:   
      MONGODB_DB_NAME: user_db      
      APP_NAME: user.service
      LOG_LEVEL: INFO
    depends_on:
      - redis
      - mongodb    
    networks:
      - backend
    restart: unless-stopped

  casesservice:
    build:
      context: ./backend
      dockerfile: cases/Dockerfile
    container_name: cases.api-ch
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      MONGODB_DB_NAME: cases_db
      APP_NAME: cases.service
      LOG_LEVEL: INFO
      AUTH_SERVICE_URL: http://authservice:8000
      PAYMENT_SERVICE_URL: http://paymentservice:8000
      USER_SERVICE_URL: http://userservice:8000
    depends_on:
      - redis
      - mongodb
    networks:
      - backend
    restart: unless-stopped

  adminservice:
    build:
      context: ./backend
      dockerfile: admin/Dockerfile
    container_name: admin.api-ch
    ports:
      - "8012:8012"
    env_file:
      - .env
    environment:
      APP_NAME: admin.service
      LOG_LEVEL: INFO
      CASE_SERVICE_URL: http://casesservice:8000
      PAYMENT_SERVICE_URL: http://paymentservice:8000
      USER_SERVICE_URL: http://userservice:8000
      AUTH_SERVICE_URL: http://authservice:8000
      S3_ENDPOINT: http://rustfs-server:9000
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      S3_BUCKET: casehub
      S3_PUBLIC_URL: http://localhost:9000
    depends_on:
      - casesservice
      - userservice
      - authservice
      - rustfs-server
    networks:
      - backend
    restart: unless-stopped

  paymentservice:
    build:
      context: ./backend/payment
      dockerfile: Dockerfile
    container_name: payment.api-ch
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB_NAME: payment_db
      AUTH_SERVICE_URL: http://authservice:8000
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - backend
    restart: unless-stopped

 
volumes:
  casehub_db_data:
  casehub_redis_data:
  casehub_rustfs_data:

networks:
  backend:
    driver: bridge
