title: CaseHub Documentation
description: Требования к проекту CaseHub — платформа виртуальных кейсов CS2
theme: just-the-docs
url: "https://mxvndi.github.io"
baseurl: ""
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-optional-front-matter
  - jekyll-relative-links

optional_front_matter:
  remove_originals: true

relative_links:
  enabled: true
  collections: true

aux_links:
  "GitHub Repository":
    - "https://github.com/MxVndI/cases"

nav_enabled: true
search_enabled: true

heading_anchors: true

back_to_top: true
back_to_top_text: "Наверх"

footer_content: "CaseHub Documentation"

color_scheme: dark

exclude:
  - node_modules/
  - backend/
  - frontend/
  - traefik/
  - docker-compose.yml
  - "*.js"
  - "*.json"
  - "*.toml"
  - Dockerfile*
