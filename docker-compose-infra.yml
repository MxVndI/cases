    rustfs-server:
        image: rustfs/rustfs:latest
        container_name: rustfs_casehub
        restart: unless-stopped
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - /mnt/rustfs/data:/data
        command: /data
        environment:
            RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
            RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
            RUSTFS_LOG_LEVEL: info
        user: "root"
        networks:
            - backend
    redis:
        image: redis:8.4.0
        container_name: redis-ch
        restart: always
        # ports NOT exposed to host — accessible only within Docker network
        volumes:
            - casehub_redis_data:/data

    mongodb:
        image: mongo:8.0
        container_name: mongodb-ch
        # ports NOT exposed to host — accessible only within Docker network
        volumes:
            - casehub_db_data:/data/db
            - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro

        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5

    mongo-express:
        image: mongo-express
        container_name: mongo-express-ch
        restart: always
        environment:
            ME_CONFIG_MONGODB_SERVER: mongodb
            ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-}
            ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-}
            ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
        ports:
            - "8081:8081"
        depends_on:
            mongodb:
                condition: service_healthy
        networks:
            - backend

    redis-commander:
        image: rediscommander/redis-commander:latest
        restart: always
        environment:
            REDIS_HOSTS: local:redis:6379
        ports:
            - 8082:8081
        depends_on:
            - redis
        networks:
            - backend

volumes:
    casehub_db_data:
    casehub_redis_data:

networks:
    backend:
        external: true
        name: casehub_backend
