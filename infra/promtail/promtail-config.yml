server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki-ch:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: network
            values: ["casehub_backend"]
    relabel_configs:
      # Use container name as job label (strip leading slash)
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'
        target_label: job
      # Use compose service name as service label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      # Keep container_name for filtering
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'
        target_label: container
    pipeline_stages:
      # Docker JSON log format: {"log":"...\n","stream":"stdout","time":"..."}
      - docker: {}
      # Extract log level from the log line
      - regex:
          expression: '(?i)(?P<level>DEBUG|INFO|WARN(?:ING)?|ERROR|CRITICAL|FATAL)'
      - labels:
          level:
      # Normalize level values
      - replace:
          expression: '(?i)warning'
          source: level
          replace: 'WARN'
      - replace:
          expression: '(?i)critical|fatal'
          source: level
          replace: 'ERROR'
